[package]
name = "madagascar-desktop"
version = "0.1.0"
description = "Madagascar local coding-agent IDE"
authors = ["Zemolabs"]
edition = "2021"

[lib]
name = "madagascar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=2.5.1"

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tauri = { version = "=2.5.1", features = [] }
