[project]
name = "madagascar-agent-server"
version = "1.36.1"
description = "Madagascar Agent Server - REST/WebSocket interface for Madagascar AI Agent"

requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.19",
  "alembic>=1.13",
  "docker>=7.1,<8",
  "fastapi>=0.104",
  "madagascar-sdk",
  "openai>=2.33.0,<3",
  "pydantic>=2",
  "sqlalchemy>=2",
  "uvicorn>=0.31.1",
  "websockets>=12",
  "wsproto>=1.2.0",
]

[project.urls]
Source = "https://github.com/Madagascar/software-agent-sdk"
Homepage = "https://github.com/Madagascar/software-agent-sdk"
Documentation = "https://docs.madagascar.dev/sdk"
"Bug Tracker" = "https://github.com/Madagascar/software-agent-sdk/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["madagascar.agent_server*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed"]
# Include Docker-related files and VSCode extensions
"madagascar.agent_server" = [
  "docker/Dockerfile",
  "docker/wallpaper.svg",
  "vscode_extensions/**/*.json",
  "vscode_extensions/**/*.js",
]

[project.scripts]
agent-server = "madagascar.agent_server.__main__:main"
