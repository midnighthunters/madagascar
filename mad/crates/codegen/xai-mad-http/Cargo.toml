[package]
license = "Apache-2.0"
name = "xai-mad-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the mad CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
xai-mad-auth = { workspace = true, features = ["middleware"] }
xai-mad-sampler = { path = "../xai-mad-sampler" }
xai-mad-telemetry = { workspace = true }
xai-mad-version = { workspace = true }
xai-mad-workspace = { workspace = true }

[lints]
workspace = true
